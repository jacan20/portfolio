<header class="site-header">
  <div class="header-top wrapper">
    <!-- Left Column: Profile Picture -->
    <div class="header-left">
      <img
        class="profile-pic"
        src="{{ '/Media/profile.jpg' | relative_url }}"
        alt="{{ site.title | escape }} profile picture"
      ></img>
    </div>

    <!-- Center Column: Site Title -->
    <div class="header-center">
      <a class="site-title" rel="author" href="{{ '/' | relative_url }}">
        {{ site.title | escape }}
      </a>
    </div>

    <!-- Right Column: Navigation -->
    <nav class="header-right">
      <a class="about-link" href="{{ '/academic-projects/' | relative_url }}">Academic</a>
      <a class="about-link" href="{{ '/personal-projects/' | relative_url }}">Personal</a>
      <a class="about-link" href="{{ '/about/' | relative_url }}">About</a>
    </nav>
  </div>
</header>
