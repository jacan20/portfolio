---
layout: default
title: "Academic Projects"
permalink: /academic-projects/
---

<h1>Academic Projects</h1>
<ul>
  {% for post in site.posts %}
    {% if post.categories contains "Academic Project" %}
      <li>
        <a href="{{ post.url }}">{{ post.title }}</a> 
        - {{ post.date | date_to_string }}
      </li>
    {% endif %}
  {% endfor %}
</ul>
